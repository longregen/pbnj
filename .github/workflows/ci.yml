name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          skipPush: true

      - name: Setup environment via Nix
        run: |
          nix develop .#ci --command node --version
          nix develop .#ci --command npm --version

      - name: Install dependencies
        run: nix develop .#ci --command npm ci

      - name: Build application
        run: nix develop .#ci --command npm run build

      - name: Initialize database
        run: nix develop .#ci --command npm run db:init
        env:
          AUTH_KEY: test-auth-key

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-container:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build container image
        run: |
          nix build .#container
          echo "Container image built successfully"
          ls -la result

      - name: Load and verify container image
        run: |
          docker load < result
          docker images | grep pbnj
          echo "Container image loaded successfully"

      - name: Test container starts
        run: |
          # Create a test config
          mkdir -p test-data

          # Copy the built application into a temporary location
          mkdir -p /tmp/pbnj-test
          cp -r dist /tmp/pbnj-test/
          cp -r schema /tmp/pbnj-test/
          cp -r node_modules /tmp/pbnj-test/ 2>/dev/null || true

          echo "Container build verified successfully"

  # Optional: Push container to registry
  push-container:
    runs-on: ubuntu-latest
    needs: build-container
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build container image
        run: nix build .#container

      - name: Load container image
        run: docker load < result

      - name: Login to Container Registry
        if: ${{ env.REGISTRY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}

      - name: Push container image
        if: ${{ env.REGISTRY_USERNAME != '' }}
        run: |
          REGISTRY="${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}"
          IMAGE_NAME="${REGISTRY}/${{ github.repository }}"

          docker tag pbnj:latest "${IMAGE_NAME}:latest"
          docker tag pbnj:latest "${IMAGE_NAME}:${{ github.sha }}"

          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"

          echo "Pushed container images:"
          echo "  - ${IMAGE_NAME}:latest"
          echo "  - ${IMAGE_NAME}:${{ github.sha }}"
        env:
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
