name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          skipPush: true

      - name: Compute npm dependencies hash
        id: npm-hash
        run: |
          HASH=$(nix run nixpkgs#prefetch-npm-deps -- package-lock.json)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Computed npm deps hash: $HASH"

      - name: Update flake with correct hash
        run: |
          sed -i 's|npmDepsHash = pkgs.lib.fakeHash;|npmDepsHash = "${{ steps.npm-hash.outputs.hash }}";|' flake.nix
          # Also handle case where there's an existing hash
          sed -i 's|npmDepsHash = "sha256-[^"]*";|npmDepsHash = "${{ steps.npm-hash.outputs.hash }}";|' flake.nix

      - name: Build application with Nix
        run: nix build --print-build-logs

      - name: Verify build output
        run: |
          ls -la result/
          ls -la result/lib/pbnj/
          echo "Build successful!"

  build-container:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Compute npm dependencies hash
        id: npm-hash
        run: |
          HASH=$(nix run nixpkgs#prefetch-npm-deps -- package-lock.json)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Update flake with correct hash
        run: |
          sed -i 's|npmDepsHash = pkgs.lib.fakeHash;|npmDepsHash = "${{ steps.npm-hash.outputs.hash }}";|' flake.nix
          sed -i 's|npmDepsHash = "sha256-[^"]*";|npmDepsHash = "${{ steps.npm-hash.outputs.hash }}";|' flake.nix

      - name: Build container image
        run: |
          nix build .#container --print-build-logs
          echo "Container image built successfully"
          ls -la result

      - name: Load and test container
        run: |
          docker load < result
          docker images | grep pbnj

          # Start container
          docker run -d --name pbnj-test \
            -e AUTH_KEY=test-key \
            -p 4321:4321 \
            pbnj:latest

          # Wait for startup
          sleep 5

          # Check container is running
          docker ps | grep pbnj-test
          docker logs pbnj-test

          # Cleanup
          docker stop pbnj-test
          docker rm pbnj-test

      - name: Save container image
        run: docker save pbnj:latest | gzip > pbnj-container.tar.gz

      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: pbnj-container.tar.gz

  # Build for Cloudflare (separate path)
  build-cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build for Cloudflare
        run: |
          nix develop .#ci --command bash -c "npm ci && npm run build:cloudflare"
          echo "Cloudflare build successful!"
          ls -la dist/

  # Push container to registry
  push-container:
    runs-on: ubuntu-latest
    needs: build-container
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download container image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load container image
        run: |
          gunzip -c pbnj-container.tar.gz | docker load
          docker images | grep pbnj

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"

          docker tag pbnj:latest "${IMAGE_NAME}:latest"
          docker tag pbnj:latest "${IMAGE_NAME}:${{ github.sha }}"

          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"

          echo "Pushed:"
          echo "  - ${IMAGE_NAME}:latest"
          echo "  - ${IMAGE_NAME}:${{ github.sha }}"

  # Deploy to Cloudflare (optional)
  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build-cloudflare
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            nix develop .#ci --command bash -c "npm ci && npm run deploy"
          else
            echo "Skipping Cloudflare deployment - CLOUDFLARE_API_TOKEN not set"
          fi
