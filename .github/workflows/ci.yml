name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          skipPush: true

      - name: Setup environment via Nix
        run: |
          nix develop .#ci --command node --version
          nix develop .#ci --command npm --version

      - name: Install dependencies
        run: nix develop .#ci --command npm ci

      - name: Build application (Node.js)
        run: nix develop .#ci --command npm run build

      - name: Build application (Cloudflare)
        run: nix develop .#ci --command npm run build:cloudflare

      - name: Test database initialization
        run: nix develop .#ci --command npm run db:init
        env:
          AUTH_KEY: test-auth-key

      - name: Upload Node.js build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-node
          path: dist/

  build-container:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-node
          path: dist/

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install dependencies for container
        run: nix develop .#ci --command npm ci --omit=dev

      - name: Build runtime container base
        run: |
          nix build .#container
          docker load < result
          echo "Base container image built successfully"

      - name: Create bundled container image
        run: |
          # Create a temporary Dockerfile to add our app to the base image
          cat > Dockerfile.bundle <<'EOF'
          FROM pbnj:latest
          COPY dist /app/dist
          COPY node_modules /app/node_modules
          COPY schema /app/schema
          COPY scripts /app/scripts
          COPY package.json /app/package.json
          EOF

          docker build -f Dockerfile.bundle -t pbnj:bundled .
          docker images | grep pbnj
          rm Dockerfile.bundle

      - name: Test container starts
        run: |
          # Start container in background
          docker run -d --name pbnj-test \
            -e AUTH_KEY=test-key \
            -p 4321:4321 \
            pbnj:bundled

          # Wait for startup
          sleep 5

          # Check if container is running
          docker ps | grep pbnj-test

          # Check logs
          docker logs pbnj-test

          # Cleanup
          docker stop pbnj-test
          docker rm pbnj-test

      - name: Save bundled container image
        run: docker save pbnj:bundled | gzip > pbnj-bundled.tar.gz

      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: pbnj-bundled.tar.gz

  # Push container to registry on main branch
  push-container:
    runs-on: ubuntu-latest
    needs: build-container
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download container image
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load container image
        run: |
          gunzip -c pbnj-bundled.tar.gz | docker load
          docker images | grep pbnj

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push container image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"

          docker tag pbnj:bundled "${IMAGE_NAME}:latest"
          docker tag pbnj:bundled "${IMAGE_NAME}:${{ github.sha }}"

          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${{ github.sha }}"

          echo "Pushed container images:"
          echo "  - ${IMAGE_NAME}:latest"
          echo "  - ${IMAGE_NAME}:${{ github.sha }}"

  # Optional: Deploy to Cloudflare
  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install dependencies
        run: nix develop .#ci --command npm ci

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: nix develop .#ci --command npm run deploy
